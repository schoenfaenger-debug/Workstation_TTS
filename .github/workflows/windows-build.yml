name: Windows build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: pyinstaller --noconfirm --onefile --windowed --name Workstation_TTS_v1 main.py
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Workstation_TTS_v1 | Out-Null
          Copy-Item dist/Workstation_TTS_v1.exe Workstation_TTS_v1/
          Compress-Archive -Path Workstation_TTS_v1 -DestinationPath Workstation_TTS_v1.zip -Force
      - uses: actions/upload-artifact@v4
        with: { name: Workstation_TTS_v1; path: Workstation_TTS_v1.zip }
